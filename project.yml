name: TinySQL
options:
  bundleIdPrefix: com.tinysql
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"

packages:
  TinyKit:
    path: Packages/TinyKit
  postgres-nio:
    url: https://github.com/vapor/postgres-nio.git
    from: "1.21.0"

targets:
  TinySQL:
    type: application
    platform: macOS
    sources:
      - path: Sources/TinySQL
        excludes:
          - "Resources"
      - path: Sources/TinySQL/Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/TinySQL/Resources/AppIcon.icon
        buildPhase: resources
      - path: Sources/TinySQL/Resources/DocIcons
        buildPhase: resources
    info:
      path: Sources/TinySQL/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDocumentTypes:
          - CFBundleTypeName: SQLite Database
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            CFBundleTypeIconFile: doc_db
            CFBundleTypeExtensions:
              - db
              - sqlite
              - sqlite3
          - CFBundleTypeName: SQL Script
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeIconFile: doc_sql
            CFBundleTypeExtensions:
              - sql
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tinysql.app
        PRODUCT_NAME: "TinySQL"
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        DEVELOPMENT_TEAM: 992N457T8D
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: TinySQL.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: NO
        INSTALL_PATH: /Applications
    dependencies:
      - package: TinyKit
        product: TinyKit
      - package: postgres-nio
        product: PostgresNIO

schemes:
  TinySQL:
    build:
      targets:
        TinySQL: all
